services:
  homeassistant:
    container_name: homeassistant-test
    image: homeassistant/home-assistant:latest
    volumes:
      # Mount the test config directory
      # - ./test-ha-config:/config
      # Mount the integration directly into custom_components
      - ./custom_components/marstek_venus_e:/config/custom_components/marstek_venus_e:ro
    environment:
      - TZ=Europe/Amsterdam
    ports:
      - "8123:8123"
    restart: unless-stopped
    privileged: false

  # Optional: Add a minimal MQTT broker for testing if needed
